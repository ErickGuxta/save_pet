{% extends "base.html" %}

{% block title %}Vacinas - SavePet{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-4">
    <div>
        <h1 class="h3 mb-1">Registro de vacinas</h1>
        <p class="text-muted mb-0">Template baseado na entidade Registro_Vacina do diagrama UML.</p>
    </div>
    <button type="button" class="btn btn-primary align-self-lg-start">Salvar registro</button>
</div>

<div class="row g-4">
    <div class="col-lg-5">
        <div class="bg-white border rounded-3 p-4">
            <h2 class="h5 mb-3">Nova vacina</h2>
            <form>
                <div class="mb-3">
                    <label class="form-label">Pet</label>
                    <select class="form-select">
                        <option>Selecione um pet</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nome da vacina</label>
                    <input class="form-control" type="text">
                </div>
                <div class="mb-3">
                    <label class="form-label">Lote</label>
                    <input class="form-control" type="text">
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Data de aplicacao</label>
                        <input class="form-control date-br-input" type="text" data-date-br="true" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Data de reforco</label>
                        <input class="form-control date-br-input" type="text" data-date-br="true" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off">
                    </div>
                </div>
                <div class="mt-3">
                    <label class="form-label">Veterinario</label>
                    <input class="form-control" type="text">
                </div>
                <div class="mt-3">
                    <label class="form-label">Clinica</label>
                    <input class="form-control" type="text">
                </div>
            </form>
        </div>
    </div>

    <div class="col-lg-7">
        <div class="bg-white border rounded-3 p-4">
            <h2 class="h5 mb-3">Historico</h2>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Pet</th>
                            <th>Vacina</th>
                            <th>Aplicacao</th>
                            <th>Reforco</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">
                                Nenhuma vacina registrada.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
