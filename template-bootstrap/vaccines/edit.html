{% extends "base.html" %}

{% block title %}Editar vacina - SavePet{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Editar vacina</h1>
        <p class="page-subtitle">Atualize os dados da vacina cadastrada.</p>
    </div>
    <a href="{% url 'vaccines:index' %}" class="pet-btn-secondary">Cancelar</a>
</div>

<form method="post" novalidate class="vaccine-form">
    {% csrf_token %}
    <div class="pet-card">
        <div class="row g-3">
            {% for field in form %}
                <div class="{% if field.name == 'pet' or field.name == 'observacoes' %}col-12{% else %}col-md-6{% endif %}">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
        </div>
    </div>
    <button type="submit" class="pet-btn-primary mt-4">Salvar alterações</button>
</form>
{% endblock %}
