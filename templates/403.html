{% extends "base.html" %}
{% load static %}

{% block title %}Acesso negado - SavePet{% endblock %}

{% block content %}
<div class="pet-card text-center mx-auto" style="max-width: 620px;">
    <img class="auth-logo mb-4" src="{% static 'img/logo.png' %}" alt="SavePet">

    <span class="pet-badge mb-3">Erro 403</span>
    <h1 class="page-title">Acesso negado</h1>
    <p class="page-subtitle mb-4">
        Você não tem permissão para acessar esta área.
    </p>

    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
        {% if user.is_authenticated %}
            <a href="{% url 'accounts:dashboard' %}" class="pet-btn-primary">Ir para o dashboard</a>
        {% else %}
            <a href="{% url 'accounts:login' %}" class="pet-btn-primary">Entrar</a>
        {% endif %}
        <a href="{% url 'blog:index' %}" class="pet-btn-secondary">Ver blog</a>
    </div>
</div>
{% endblock %}
