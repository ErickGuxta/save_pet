<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ article.titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">{{ article.titulo }}</h1>
            <a href="{% url 'blog:index' %}" class="btn btn-outline-secondary">Voltar</a>
        </div>
        <p class="text-muted">{{ article.categoria.nome }} · {{ article.data_publicacao|date:"d/m/Y H:i" }}</p>
        <div class="mb-4">{{ article.conteudo|linebreaks }}</div>
        {% if request.user.is_superuser %}
            <a href="{% url 'blog:edit' article.id %}" class="btn btn-primary">Editar</a>
        {% endif %}
    </main>
</body>
</html>
