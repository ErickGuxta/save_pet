<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minha Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Minha Conta</h1>
            <a href="{% url 'pets:index' %}" class="btn btn-outline-secondary">Pets</a>
        </div>

        <dl class="row">
            <dt class="col-sm-3">Dono</dt>
            <dd class="col-sm-9">{{ request.user.username }}</dd>
            <dt class="col-sm-3">Nome</dt>
            <dd class="col-sm-9">{{ request.user.first_name }}</dd>
            <dt class="col-sm-3">E-mail</dt>
            <dd class="col-sm-9">{{ request.user.email }}</dd>
            <dt class="col-sm-3">CPF</dt>
            <dd class="col-sm-9">{{ dono.cpf|default:"-" }}</dd>
            <dt class="col-sm-3">Telefone</dt>
            <dd class="col-sm-9">{{ dono.telefone|default:"-" }}</dd>
            <dt class="col-sm-3">Cidade</dt>
            <dd class="col-sm-9">{{ dono.cidade|default:"-" }}</dd>
            <dt class="col-sm-3">Estado</dt>
            <dd class="col-sm-9">{{ dono.estado|default:"-" }}</dd>
        </dl>

        <a href="{% url 'accounts:edit' %}" class="btn btn-primary">Editar</a>
        <a href="{% url 'accounts:delete' %}" class="btn btn-outline-danger">Excluir conta</a>
        <a href="{% url 'accounts:logout' %}" class="btn btn-outline-secondary">Sair</a>
    </main>
</body>
</html>
