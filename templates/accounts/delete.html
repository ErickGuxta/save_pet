{% extends "base.html" %}

{% block title %}Excluir conta - SavePet{% endblock %}

{% block content %}
<div class="pet-card confirm-card">
    <h1 class="h4 mb-3">Excluir conta</h1>
    <p class="text-muted">Confirme a exclusão da sua conta. Esta ação remove seu acesso ao sistema.</p>

    <form method="post" class="d-flex flex-wrap gap-3 mt-4">
        {% csrf_token %}
        <button type="submit" class="pet-btn-primary pet-btn-delete">Excluir</button>
        <a href="{% url 'accounts:detail' %}" class="pet-btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
