<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Pets</h1>
            <div>
                <a href="{% url 'accounts:detail' %}" class="btn btn-outline-secondary">Conta</a>
                <a href="{% url 'vaccines:index' %}" class="btn btn-outline-secondary">Vacinas</a>
                <a href="{% url 'pets:create' %}" class="btn btn-primary">Novo pet</a>
            </div>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Espécie</th>
                    <th>Raça</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for pet in pets %}
                    <tr>
                        <td>{{ pet.nome }}</td>
                        <td>{{ pet.especie }}</td>
                        <td>{{ pet.raca }}</td>
                        <td class="text-end">
                            <a href="{% url 'pets:detail' pet.id %}" class="btn btn-sm btn-outline-primary">Ver</a>
                            <a href="{% url 'pets:edit' pet.id %}" class="btn btn-sm btn-outline-secondary">Editar</a>
                            <a href="{% url 'pets:delete' pet.id %}" class="btn btn-sm btn-outline-danger">Excluir</a>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="4">Nenhum pet cadastrado.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>
</body>
</html>
