<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ vaccine.nome_vacina }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">{{ vaccine.nome_vacina }}</h1>
            <a href="{% url 'vaccines:index' %}" class="btn btn-outline-secondary">Voltar</a>
        </div>

        <dl class="row">
            <dt class="col-sm-3">Pet</dt>
            <dd class="col-sm-9">{{ vaccine.pet.nome }}</dd>
            <dt class="col-sm-3">Lote</dt>
            <dd class="col-sm-9">{{ vaccine.lote }}</dd>
            <dt class="col-sm-3">Aplicação</dt>
            <dd class="col-sm-9">{{ vaccine.data_aplicacao|date:"d/m/Y" }}</dd>
            <dt class="col-sm-3">Reforço</dt>
            <dd class="col-sm-9">{{ vaccine.data_reforco|date:"d/m/Y"|default:"-" }}</dd>
            <dt class="col-sm-3">Veterinário</dt>
            <dd class="col-sm-9">{{ vaccine.veterinario }}</dd>
            <dt class="col-sm-3">Clínica</dt>
            <dd class="col-sm-9">{{ vaccine.clinica }}</dd>
        </dl>

        <a href="{% url 'vaccines:edit' vaccine.id %}" class="btn btn-primary">Editar</a>
    </main>
</body>
</html>
